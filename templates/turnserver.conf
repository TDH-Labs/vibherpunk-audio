# Vibherpunk Audio — coturn configuration (template).
# Install to ~/.hermes/turnserver.conf (chmod 600 — it contains a secret).
#
# Substitute:
#   {{TURN_SECRET}}    the SAME generated value stored in
#                      ~/.hermes/turn-auth-secret (the mobile server reads
#                      that file and mints time-limited TURN credentials
#                      from it; coturn checks them against this value)
#   {{TAILNET_IPV4}}   this machine's Tailscale IPv4 (100.x.x.x)
#   {{TAILNET_IPV6}}   this machine's Tailscale IPv6 (fd7a:...) — delete
#                      the second listening-ip line if you don't use IPv6
#   {{TURN_REALM}}     a realm name you choose (any stable string)
#   {{MACHINE_NAME}}   this machine's name
#
# Port values below (3478, 49152–65535) are the reference build's
# listening port and coturn's standard relay range. Peer access is
# restricted to the Tailscale CGNAT range — keep it that way: this
# relay must never be open to the public internet.

listening-ip={{TAILNET_IPV4}}
listening-ip={{TAILNET_IPV6}}
listening-port=3478
min-port=49152
max-port=65535

use-auth-secret
static-auth-secret={{TURN_SECRET}}
realm={{TURN_REALM}}
server-name={{MACHINE_NAME}}
fingerprint

total-quota=100
user-quota=10
stale-nonce=600

allowed-peer-ip=127.0.0.1
allowed-peer-ip=100.64.0.0-100.127.255.255

no-multicast-peers
no-cli
simple-log
pidfile=/tmp/turnserver.pid
